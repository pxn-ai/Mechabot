<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2WD Car Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0e1a;
            --surface: rgba(255,255,255,0.04);
            --glass: rgba(255,255,255,0.06);
            --glass-border: rgba(255,255,255,0.1);
            --accent: #00e5ff;
            --accent-glow: rgba(0,229,255,0.3);
            --accent-dim: rgba(0,229,255,0.12);
            --danger: #ff3d71;
            --danger-glow: rgba(255,61,113,0.3);
            --warn: #ffaa00;
            --success: #0cce6b;
            --text: #e8eaf6;
            --text-dim: rgba(232,234,246,0.45);
            --radius: 18px;
        }

        html, body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ── Animated background ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 400px at 15% 15%, rgba(0,229,255,0.07), transparent),
                radial-gradient(ellipse 500px 500px at 85% 85%, rgba(123,97,255,0.05), transparent);
            z-index: -1;
            animation: bgShift 15s ease-in-out infinite alternate;
        }
        @keyframes bgShift { to { filter: hue-rotate(25deg); } }
        @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        /* ── Header ── */
        .header {
            width: 100%;
            padding: 18px 20px 8px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent), #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 6px;
            font-size: 0.72rem;
            color: var(--text-dim);
        }
        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            vertical-align: middle;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        .action-label {
            font-weight: 600;
            color: var(--text-dim);
            transition: color 0.2s;
        }
        .action-label.moving { color: var(--accent); }

        /* ── Cards ── */
        .card {
            width: min(92%, 380px);
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 12px;
            animation: fadeIn 0.6s ease-out both;
        }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.3s; }
        .card-title {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        /* ── Distance ── */
        .distance-display { text-align: center; }
        .distance-value {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
            transition: color 0.3s;
        }
        .distance-value.close { color: var(--danger); }
        .distance-value.mid { color: var(--warn); }
        .distance-value.far { color: var(--success); }
        .distance-unit {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-left: 3px;
        }
        .distance-bar {
            margin-top: 10px;
            height: 5px;
            border-radius: 3px;
            background: var(--surface);
            overflow: hidden;
        }
        .distance-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease, background 0.4s;
            width: 0%;
        }
        .distance-labels {
            font-size: 0.62rem;
            color: var(--text-dim);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* ── Speed ── */
        .speed-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .speed-val {
            min-width: 38px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--accent);
        }
        .slider-wrap { flex: 1; }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent-dim), var(--accent-dim));
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px; height: 26px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 14px var(--accent-glow);
            cursor: pointer;
            border: 3px solid var(--bg);
        }
        .speed-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-top: 3px;
        }

        /* ── D-Pad ── */
        .dpad {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 10px;
            width: 250px;
            height: 250px;
            margin: 0 auto;
        }
        .dpad-btn {
            border: none;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: all 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .dpad-btn svg { width: 26px; height: 26px; fill: currentColor; }

        .btn-dir {
            background: linear-gradient(145deg, rgba(0,229,255,0.12), rgba(0,229,255,0.04));
            border: 1px solid rgba(0,229,255,0.18);
            color: var(--accent);
        }
        .btn-dir:active, .btn-dir.active {
            background: linear-gradient(145deg, rgba(0,229,255,0.32), rgba(0,229,255,0.12));
            box-shadow: 0 0 22px var(--accent-glow), inset 0 0 10px rgba(0,229,255,0.08);
            transform: scale(0.94);
        }
        .btn-stop {
            background: linear-gradient(145deg, rgba(255,61,113,0.15), rgba(255,61,113,0.04));
            border: 1px solid rgba(255,61,113,0.2);
            color: var(--danger);
            border-radius: 50%;
        }
        .btn-stop:active, .btn-stop.active {
            background: linear-gradient(145deg, rgba(255,61,113,0.4), rgba(255,61,113,0.12));
            box-shadow: 0 0 22px var(--danger-glow), inset 0 0 10px rgba(255,61,113,0.08);
            transform: scale(0.9);
        }

        .btn-fwd   { grid-column: 2; grid-row: 1; }
        .btn-left  { grid-column: 1; grid-row: 2; }
        .btn-stop  { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-bwd   { grid-column: 2; grid-row: 3; }

        /* ── Footer ── */
        .footer {
            margin-top: auto;
            padding: 10px;
            font-size: 0.6rem;
            color: var(--text-dim);
            text-align: center;
        }

        /* ── Responsive ── */
        @media (max-height: 680px) {
            .dpad { width: 210px; height: 210px; gap: 8px; }
            .distance-value { font-size: 2rem; }
            .card { padding: 12px 14px; margin-bottom: 8px; }
            .header { padding: 12px 16px 6px; }
            .header h1 { font-size: 1.15rem; }
        }
        @media (min-height: 900px) {
            .dpad { width: 280px; height: 280px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ 2WD Car Controller</h1>
        <div class="status-bar">
            <span><span class="status-dot"></span>Bridge Connected</span>
            <span class="action-label" id="actionLabel">Idle</span>
        </div>
    </div>

    <!-- Distance -->
    <div class="card">
        <div class="card-title">Front Distance</div>
        <div class="distance-display">
            <span class="distance-value far" id="distVal">--</span><span class="distance-unit">cm</span>
            <div class="distance-bar">
                <div class="distance-bar-fill" id="distBar"></div>
            </div>
            <div class="distance-labels"><span>Close</span><span>Far</span></div>
        </div>
    </div>

    <!-- Speed -->
    <div class="card">
        <div class="card-title">Speed</div>
        <div class="speed-section">
            <div class="speed-val" id="speedVal">180</div>
            <div class="slider-wrap">
                <input type="range" id="speedSlider" min="80" max="255" value="180">
                <div class="speed-labels"><span>Slow</span><span>Max</span></div>
            </div>
        </div>
    </div>

    <!-- D-Pad -->
    <div class="card">
        <div class="card-title">Controls</div>
        <div class="dpad">
            <button class="dpad-btn btn-dir btn-fwd" data-cmd="forward">
                <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>FWD
            </button>
            <button class="dpad-btn btn-dir btn-left" data-cmd="left">
                <svg viewBox="0 0 24 24"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>LEFT
            </button>
            <button class="dpad-btn btn-stop" data-cmd="stop">
                <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>STOP
            </button>
            <button class="dpad-btn btn-dir btn-right" data-cmd="right">
                <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v5H4v6h8v5z"/></svg>RIGHT
            </button>
            <button class="dpad-btn btn-dir btn-bwd" data-cmd="backward">
                <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-5V4H9v8H4z"/></svg>BWD
            </button>
        </div>
    </div>

    <div class="footer">HC-05 Bridge &middot; <strong>{{ server_ip }}:{{ server_port }}</strong></div>

    <script>
    (function() {
        const speedSlider = document.getElementById('speedSlider');
        const speedVal    = document.getElementById('speedVal');
        const distVal     = document.getElementById('distVal');
        const distBar     = document.getElementById('distBar');
        const actionLabel = document.getElementById('actionLabel');
        const buttons     = document.querySelectorAll('.dpad-btn');

        let currentSpeed = speedSlider.value;

        // ── Speed slider ──
        speedSlider.addEventListener('input', () => {
            currentSpeed = speedSlider.value;
            speedVal.textContent = currentSpeed;
        });

        // ── Send command to bridge server ──
        function sendCmd(cmd) {
            const url = cmd === 'stop'
                ? '/stop'
                : `/${cmd}?speed=${currentSpeed}`;
            console.log('[CMD] Sending:', url);
            fetch(url)
                .then(r => r.json())
                .then(d => console.log('[CMD] Response:', JSON.stringify(d)))
                .catch(e => console.error('[CMD] Error:', e));
        }

        // ── Update action label ──
        function setAction(cmd) {
            if (cmd === 'stop') {
                actionLabel.textContent = 'Stopped';
                actionLabel.classList.remove('moving');
            } else {
                actionLabel.textContent = cmd.charAt(0).toUpperCase() + cmd.slice(1);
                actionLabel.classList.add('moving');
            }
        }

        // ── Button event handling ──
        // Use pointerdown/pointerup (modern, works on both touch & mouse)
        // Fallback to touchstart/touchend + mousedown/mouseup
        buttons.forEach(btn => {
            const cmd = btn.dataset.cmd;
            let pressed = false;

            function press(e) {
                if (pressed) return;
                pressed = true;
                e.preventDefault();
                btn.classList.add('active');
                sendCmd(cmd);
                setAction(cmd);
            }

            function release(e) {
                if (!pressed) return;
                pressed = false;
                e.preventDefault();
                btn.classList.remove('active');
                if (cmd !== 'stop') {
                    sendCmd('stop');
                    actionLabel.textContent = 'Idle';
                    actionLabel.classList.remove('moving');
                }
            }

            // Pointer API (unified touch+mouse, best support)
            if (window.PointerEvent) {
                btn.addEventListener('pointerdown', press);
                btn.addEventListener('pointerup', release);
                btn.addEventListener('pointercancel', release);
                btn.addEventListener('pointerleave', (e) => {
                    if (pressed) release(e);
                });
                // Prevent touch-action default to avoid scroll/zoom interference
                btn.style.touchAction = 'none';
            } else {
                // Fallback: touch + mouse
                btn.addEventListener('touchstart', press, { passive: false });
                btn.addEventListener('touchend', release, { passive: false });
                btn.addEventListener('touchcancel', release, { passive: false });
                btn.addEventListener('mousedown', press);
                btn.addEventListener('mouseup', release);
                btn.addEventListener('mouseleave', () => btn.classList.remove('active'));
            }

            // Additional onclick fallback for simple taps
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                // For quick taps that might not trigger pointer events properly
                if (!pressed) {
                    sendCmd(cmd);
                    setAction(cmd);
                    btn.classList.add('active');
                    setTimeout(() => {
                        btn.classList.remove('active');
                        if (cmd !== 'stop') {
                            sendCmd('stop');
                            actionLabel.textContent = 'Idle';
                            actionLabel.classList.remove('moving');
                        }
                    }, 200);
                }
            });
        });

        // ── Distance polling ──
        async function pollDistance() {
            try {
                const res  = await fetch('/distance');
                const data = await res.json();
                const d    = data.distance;

                if (d < 0) {
                    distVal.textContent = '--';
                    distVal.className = 'distance-value far';
                    distBar.style.width = '0%';
                    distBar.style.background = 'var(--success)';
                } else {
                    distVal.textContent = d.toFixed(1);
                    const pct = Math.min(100, (d / 200) * 100);
                    distBar.style.width = pct + '%';

                    if (d < 15) {
                        distVal.className = 'distance-value close';
                        distBar.style.background = 'var(--danger)';
                    } else if (d < 40) {
                        distVal.className = 'distance-value mid';
                        distBar.style.background = 'var(--warn)';
                    } else {
                        distVal.className = 'distance-value far';
                        distBar.style.background = 'var(--success)';
                    }
                }
            } catch(e) {
                distVal.textContent = '--';
                console.error('[DIST] Poll error:', e);
            }
        }

        setInterval(pollDistance, 500);
        pollDistance();

        console.log('[INIT] 2WD Controller loaded, buttons:', buttons.length);
    })();
    </script>
</body>
</html>
